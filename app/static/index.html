<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice AI Agent</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px; margin: 3rem auto; padding: 0 1.25rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: .25rem; }
    p.lead { color: #666; margin-top: 0; }
    fieldset { border: 1px solid #ddd; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    legend { padding: 0 .5rem; font-weight: 600; }
    label { display: block; font-size: .9rem; margin: .65rem 0 .25rem; }
    input, select, textarea, button {
      width: 100%; padding: .6rem .75rem; font-size: 1rem;
      border: 1px solid #ccc; border-radius: 8px; background: transparent; color: inherit;
    }
    button {
      margin-top: 1rem; background: #2563eb; color: white; border: 0; cursor: pointer;
      font-weight: 600; transition: background .15s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 1rem; padding: .75rem 1rem; border-radius: 8px; display: none; white-space: pre-wrap; }
    .ok { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    .err { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    .vars { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 1rem; }
    .vars label { margin-top: .25rem; }
    small.hint { color: #666; }
  </style>
</head>
<body>
  <h1>Voice AI Agent</h1>
  <p class="lead">Trigger an outbound call for an event registration confirmation.</p>

  <form id="call-form">
    <fieldset>
      <legend>Call target</legend>
      <label for="phone">Phone number (E.164, e.g. +14155551234)</label>
      <input id="phone" name="phone" required placeholder="+14155551234" />

      <label for="scenario">Scenario</label>
      <select id="scenario" name="scenario" required></select>
      <small class="hint" id="scenario-desc"></small>
    </fieldset>

    <fieldset>
      <legend>Scenario variables</legend>
      <div class="vars" id="vars"></div>
    </fieldset>

    <button id="submit" type="submit">Place call</button>
  </form>

  <div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const varsEl = $("vars");
const scenarioSel = $("scenario");
const scenarioDesc = $("scenario-desc");

let scenarios = [];

function renderVars(scenario) {
  varsEl.innerHTML = "";
  scenarioDesc.textContent = scenario.description;
  for (const v of scenario.variables) {
    const label = document.createElement("label");
    label.textContent = v;
    label.htmlFor = `var-${v}`;
    const input = document.createElement("input");
    input.id = `var-${v}`;
    input.name = v;
    input.placeholder = v;
    varsEl.appendChild(label);
    varsEl.appendChild(input);
  }
}

async function loadScenarios() {
  const r = await fetch("/api/scenarios");
  scenarios = await r.json();
  scenarioSel.innerHTML = scenarios.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  scenarioSel.addEventListener("change", () => {
    renderVars(scenarios.find(s => s.id === scenarioSel.value));
  });
  if (scenarios.length) renderVars(scenarios[0]);
}

function showStatus(msg, ok) {
  statusEl.textContent = msg;
  statusEl.className = ok ? "ok" : "err";
  statusEl.style.display = "block";
}

$("call-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("submit");
  btn.disabled = true; btn.textContent = "Placing call…";
  const variables = {};
  for (const input of varsEl.querySelectorAll("input")) {
    if (input.value.trim()) variables[input.name] = input.value.trim();
  }
  const body = {
    phone_number: $("phone").value.trim(),
    scenario_id: scenarioSel.value,
    variables,
  };
  try {
    const r = await fetch("/api/calls", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Request failed");
    showStatus(`Call initiated.\nSession: ${data.session_id}\nTwilio SID: ${data.call_sid}`, true);
  } catch (err) {
    showStatus(`Error: ${err.message}`, false);
  } finally {
    btn.disabled = false; btn.textContent = "Place call";
  }
});

loadScenarios();
</script>
</body>
</html>
